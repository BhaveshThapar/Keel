[package]
name = "keel-server"
description = "The Keel node daemon: an HTTP status and metrics surface over a running Ready loop."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["database-implementations"]
keywords = ["raft", "server", "prometheus", "metrics", "daemon"]

[[bin]]
name = "keel-server"
path = "src/main.rs"

[[bin]]
name = "keel-admin"
path = "src/bin/keel-admin.rs"

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
keel-api = { workspace = true }
keel-log = { workspace = true }
keel-net = { workspace = true, features = ["tcp"] }
keel-node = { workspace = true, features = ["lsm"] }
keel-raft = { workspace = true }
keel-sm = { workspace = true, features = ["lsm"] }
lsm_kv = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bytes = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
