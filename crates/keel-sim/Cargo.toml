[package]
name = "keel-sim"
description = "Deterministic discrete-event simulator for sans-IO consensus cores: seeded partitions, crashes, and clock skew, with Raft safety invariants checked after every event."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
categories = ["development-tools::testing", "simulation"]
keywords = ["raft", "simulation", "deterministic", "testing", "distributed"]

[dependencies]
keel-raft = { workspace = true }
keel-log = { workspace = true }
keel-rand = { workspace = true }
# The real state machine, on MemStore. No thread, no file descriptor, no clock:
# it applies what it is handed and keeps the result in a BTreeMap. Driving a
# model of it instead would leave the one component whose bugs are hardest to
# see — apply — untested by every seed.
keel-sm = { workspace = true }
# The wire types the workload proposes and the state machine applies.
keel-api = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
# The simulator's filesystem is held to the same assertions as the real one, so
# the suite has to be reachable from here. This edge is why `keel-sim` may
# depend on `keel-log` at all: without it the seam has two implementations and
# nothing that says they agree.
keel-log = { workspace = true, features = ["conformance"] }

[features]
# Forwarded to keel-raft so the negative demonstrations can disable a safety
# rule and show the simulator catching the resulting violation (TR-8).
negative-demos = ["keel-raft/negative-demos", "keel-log/negative-demos"]

[[bin]]
name = "keel-sim"
path = "src/main.rs"

[lints]
workspace = true
