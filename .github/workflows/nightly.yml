name: Nightly

# The per-PR sweep is wide and shallow: many seeds, 50k steps each. A long run is
# the opposite, and it finds a different class of bug — anything that needs a
# cluster to have been alive for a while, such as a counter that wraps, a
# structure that grows without bound, or an interleaving that only becomes
# reachable after enough leadership changes have accumulated.
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  long-run:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes, 1M steps
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        nodes: [3, 5]
        profile:
          [
            default,
            chaos,
            fig8-hunt,
            read-hunt,
            lease-drift,
            membership-hunt,
            snapshot-hunt,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 25 seeds x 1M steps
        run: |
          cargo run --release -p keel-sim -- run \
            --from 100000 --count 25 --steps 1000000 \
            --nodes ${{ matrix.nodes }} --profile ${{ matrix.profile }}

  # Seeds above 100000 are the nightly's own range, so a failure here names a
  # seed the per-PR sweep has never run — and `keel-sim repro --seed N` still
  # reproduces it byte for byte on a laptop.
  # The disk profiles cost enough per event that a nightly is where a long run
  # over them is affordable at all. A tear that only appears after a cluster has
  # been alive for a while is exactly the class this job exists for.
  disk-long-run:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes, 200k steps
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        nodes: [3, 5]
        profile: [disk-chaos, disk-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 25 seeds x 200k steps over the real log
        run: |
          cargo run --release -p keel-sim -- run \
            --from 100000 --count 25 --steps 200000 \
            --nodes ${{ matrix.nodes }} --profile ${{ matrix.profile }}

  # The per-PR seed counts are derived from a throughput measurement taken on a
  # developer laptop, divided by an assumed factor of 6 for a runner nobody had
  # measured. This job is how that assumption stops being one: it runs the same
  # script on the runner itself, so the factor can be replaced by a number and
  # the sizing comments in ci.yml can cite a runner-measured file.
  throughput:
    name: what a seed-run costs on the runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/throughput.sh
      - uses: actions/upload-artifact@v4
        with:
          name: disk-throughput
          path: results/simulator/disk-throughput.txt

  # The simulator finds consensus bugs; this finds the ones it cannot have,
  # because it replaces the parts they live in — a scheduler, a TCP stack, a
  # page cache, a SIGSTOP that lands between two instructions. It is nightly
  # rather than per-PR because each seed costs real seconds of wall clock and
  # its failures do not replay exactly: the schedule replays, the interleaving
  # does not.
  #
  # And it is here that the clock nemesis runs without a container. The runner
  # is Linux, so libfaketime can move CLOCK_MONOTONIC directly; the container in
  # scripts/chaos-clock.sh exists because a macOS laptop cannot host that fault
  # at all, not because the fault needs one.
  chaos:
    name: a real cluster under a seeded fault schedule
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: libfaketime, so the schedule includes clock jumps
        run: sudo apt-get update && sudo apt-get install -y faketime
      - run: scripts/chaos.sh 45 1 2 3 4 5 6 7 8
      # The kill loop is the other half, and it is a different question. The
      # schedule above asks whether the cluster survives faults it can wait out;
      # this asks whether it still holds what it said it held after a thousand
      # crashes. It found KEEL-9.
      - run: scripts/kill-loop.sh 1000 durable 250
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-real-cluster
          path: |
            results/chaos/real-cluster.txt
            results/chaos/kill-loop.txt

  # The external checker, and the control arm that makes its acceptance mean
  # something. Nightly rather than per-PR because the run needs a real cluster
  # under faults for long enough to record a history worth checking, and
  # porcupine's search is exponential in the worst case.
  porcupine:
    name: a real cluster's history, checked by somebody else
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/porcupine.sh 11 40
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: porcupine
          path: results/porcupine/lin-check.txt

  # Maelstrom with the partition nemesis. Java and gnuplot are both required:
  # without gnuplot the run reports :unknown while every correctness check
  # passes, which is an inconclusive result nobody can tell from a real one.
  maelstrom:
    name: Maelstrom lin-kv under partition
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: sudo apt-get update && sudo apt-get install -y gnuplot
      - uses: Swatinem/rust-cache@v2
      - run: scripts/maelstrom.sh 60 30 partition
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maelstrom-partition
          path: results/maelstrom/lin-kv-partition.txt

  # The benchmark harness, run for its own sake rather than for its numbers.
  # A runner is a shared virtual machine and its throughput figures are noise;
  # what this job checks is that the gate still refuses what it should, the
  # campaign still produces a curve, and the failover harness still finds a
  # leader to kill. A benchmark harness that has quietly stopped working looks
  # exactly like one that is working until somebody needs a number.
  bench-harness:
    name: the benchmark harness still runs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: what this runner may publish
        run: cargo run --release -p keel-bench -- gate --dir .
      - name: a short campaign, admitted rather than published
        run: |
          cargo build --release -p keel-bench -p keel-server
          WORK="$(mktemp -d)"
          ./target/release/keel-bench campaign \
            --mix writes --rates 50,100,200 --secs 4 --runs 3 \
            --dir "$WORK" --server-bin ./target/release/keel-server \
            --sync durable --root "$WORK" \
            --out campaign.txt --svg campaign.svg \
            --admit "a CI smoke run on a shared runner; its numbers are noise"
      - name: failover, enough trials to be a shape rather than a draw
        run: |
          WORK="$(mktemp -d)"
          ./target/release/keel-bench failover \
            --trials 110 --tick-ms 30 \
            --dir "$WORK" --server-bin ./target/release/keel-server \
            --sync durable --root "$WORK" --out failover.txt \
            --admit "a CI smoke run on a shared runner"
      - name: a small snapshot follows the production transfer path
        run: |
          WORK="$(mktemp -d)"
          ./target/release/keel-bench snapshot \
            --state-bytes 1048576 --value-bytes 65536 \
            --depth 8 --runs 1 \
            --dir "$WORK" --server-bin ./target/release/keel-server \
            --sync durable --root "$WORK" --out snapshot.txt \
            --admit "a CI smoke run on a shared runner"

  determinism-at-length:
    name: a long run still replays identically
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo run --release -p keel-sim -- determinism \
            --from 100000 --count 10 --steps 500000
