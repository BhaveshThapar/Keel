name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features, because feature-gated code is exactly the code nobody
      # compiles by accident. This caught a module in the vendored engine that
      # had not compiled in four commits, because every check on both sides ran
      # with default features.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # And the default-feature build, which is what a consumer gets and what
      # the isolation gates are about: keel-net without `tcp` links no socket,
      # keel-sm without `lsm` links no storage engine.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The negative demonstrations must still demonstrate
        run: cargo test -p keel-raft --features negative-demos
      # Same discipline for the state machine: the build with ADR-010's rule
      # removed has a test that asserts the kill loop catches it.
      - run: cargo test -p keel-sm --features negative-demos
      # The fuzz targets' checksum demonstration has two arms and only one of
      # them compiles at a time. Without this the intact build's "a corrupted
      # record is rejected" is a test that a log rejects something, which a log
      # that rejected everything would also pass.
      - run: cargo test -p keel-fuzz --features negative-demos
      # keel-sim forwards the feature to keel-raft. Nothing else compiles that
      # forward, so without this a break in it would surface only inside the
      # negative-demo script, as a confusing failure a long way from its cause.
      - name: The simulator's feature forward must still compile
        run: cargo check -p keel-sim --features negative-demos --all-targets

  # A row in CORRECTNESS.md naming a test that no longer exists reads as
  # enforcement and enforces nothing, which is worse than a row that was never
  # written. Same for an ADR citation, a bug number, or a committed result whose
  # provenance says it came from a commit this branch does not contain.
  docs:
    name: the documents still name real things
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # check-artifacts.sh asks whether each artifact's commit is an ancestor
        # of HEAD, which a shallow clone cannot answer.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The checkers are themselves shell, and so is every script that records
      # an artifact. An unquoted expansion in one of those is how a check comes
      # to pass by examining nothing.
      - name: the scripts lint
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/negative-demos/*.sh
      - run: scripts/check-docs.sh
      - run: scripts/check-artifacts.sh
      # And the sweep covers as many distinct seeds as its comments claim. The
      # shard arithmetic lives in a shell expression nothing else reads back.
      - run: scripts/check-ci-budget.sh 2000 50000

  # A thousand kill/restart cycles is the exit criterion, and it takes minutes —
  # its own job rather than a slow line in the test suite, which runs sixty.
  kill-loop:
    name: a thousand kills, no double-apply
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 1000 kill/restart cycles mid-apply
        env:
          KEEL_SM_KILL_CYCLES: "1000"
        run: cargo test --release -p keel-sm --test kill_during_apply

  # Three real processes over real sockets, killed and restarted. Its own job
  # because it builds two binaries and spends most of its time waiting for
  # elections, neither of which belongs in the unit-test job's budget.
  cluster:
    name: three real nodes serve traffic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p keel-client --test cluster -- --test-threads=1

  determinism:
    name: the core replays identically
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run the determinism suite twice and require identical output. A
      # nondeterminism leak — an ambient clock, a hash-map iteration order —
      # turns into a red build the day it is introduced, rather than being
      # noticed months later when a simulator seed stops reproducing.
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run1.txt
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run2.txt
      - run: diff run1.txt run2.txt
      # The disk is inside the world's fingerprint now, so this is the gate that
      # would catch a nondeterministic tear. It can only do that if it is pointed
      # at a profile that tears.
      - name: the simulated disk replays identically
        run: |
          cargo run --release -p keel-sim -- determinism \
            --from 0 --count 40 --steps 30000 --nodes 3 --profile disk-hunt

  simulator:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Cluster size is not a detail. Commit needs the k-th highest match index
      # where k is the quorum size, so at five nodes two followers must sit on an
      # earlier term's entry at once and at three nodes only one must. KEEL-4:
      # a five-node cluster reached the Figure 8 window zero times, which made a
      # correct build and a deliberately broken one indistinguishable. Sweeping
      # only one size is how that bug survived.
      matrix:
        shard: [0, 1]
        nodes: [3, 5]
        profile: [default, chaos, fig8-hunt, read-hunt, lease-drift, membership-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 1,000 seeds a shard, two shards, so the sweep covers 2,000 distinct
      # seeds per profile and cluster size — TR-3's target, and the reason this
      # number moved.
      #
      # The arithmetic, from results/simulator/disk-throughput.txt: the slowest
      # cell of this matrix is chaos at 5 nodes, 511,400 steps/s on an M2 Pro.
      # Divided by 6 for a runner nobody has measured yet, 85,233 steps/s.
      # 1,000 seeds x 50,000 steps is 50,000,000 steps, so 587 seconds — 9.8 of
      # the job's 25 available sweep-minutes.
      #
      # That margin is 2.5x rather than the 5x this job carried at 500 seeds,
      # and shrinking it is the price of the target rather than an oversight.
      # The runner factor can still be wrong by two and a half times before this
      # goes red, and the nightly throughput job exists to replace that factor
      # with a measurement.
      #
      # The stride equals the count, so the two shards cover 0..999 and
      # 1000..1999 with no seed swept twice. scripts/check-ci-budget.sh reads
      # these numbers back out of this file and fails if they stop adding up —
      # a stride smaller than the count would halve the coverage while every
      # job still passed in the same time.
      - name: 1000 seeds x 50k steps
        run: |
          cargo run --release -p keel-sim -- run \
            --from $(( ${{ matrix.shard }} * 1000 )) --count 1000 \
            --steps 50000 --nodes ${{ matrix.nodes }} \
            --profile ${{ matrix.profile }}

  # The disk profiles run the real log over a disk that tears, so every record is
  # really encoded, checksummed, written and parsed and every restart re-scans
  # every segment. That costs enough per event to need its own job at its own
  # seed count rather than more cells on the matrix above — cutting the sweep
  # there to pay for it would trade breadth for depth in the wrong direction.
  #
  # Both sector sizes run. 4096 is what modern hardware is; 512 is where a
  # record of a few hundred bytes straddles a boundary often enough to tear.
  # A write only tears when it straddles one, so this axis is not a detail.
  disk-simulator:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
        nodes: [3, 5]
        profile: [disk-chaos, disk-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 500 seeds a shard, two shards, 1,000 distinct — and deliberately *not*
      # the 2,000 the job above reaches. From the same file: disk-chaos at 5
      # nodes is the slowest cell in the workspace at 169,996 steps/s, which is
      # 28,333 on a runner at the assumed factor. 500 x 40,000 is 20,000,000
      # steps, so 706 seconds — 11.8 of the 25 available sweep-minutes, already
      # a longer job than the 50k-step sweep despite a fifth of the seeds.
      #
      # Reaching 2,000 here would need four shards at 47 minutes of runner time
      # per profile and cluster size, and it would buy breadth in the cheapest
      # dimension. It is not claimed, which is why the number is written down
      # next to the one it is not.
      #
      # That a seed-run costs roughly three times as much is the finding rather
      # than the concession: every record is really encoded, checksummed,
      # written and parsed, and every restart re-scans every segment.
      - name: 500 seeds x 40k steps over the real log
        run: |
          cargo run --release -p keel-sim -- run \
            --from $(( ${{ matrix.shard }} * 500 )) --count 500 \
            --steps 40000 \
            --nodes ${{ matrix.nodes }} \
            --profile ${{ matrix.profile }}

  negative-demo:
    name: ${{ matrix.demo }} must have teeth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A matrix, so a failure names which demonstration stopped demonstrating
      # rather than just that one of them did.
      fail-fast: false
      matrix:
        demo:
          [
            figure-8,
            torn-record,
            tearing-is-load-bearing,
            split-batch,
            apply-ordering,
            pre-vote,
            lease-drift,
          ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Removing a safety rule must make the simulator fail. A clean run is only
      # evidence if a broken build would have produced a dirty one. And
      # tearing-is-load-bearing holds the bug fixed and varies the fault model
      # instead, because three of the seven bugs so far were in the harness.
      - name: the rule removed must produce a violation
        run: scripts/negative-demos/${{ matrix.demo }}.sh
