[package]
name = "keel-log"
description = "Keel's durable Raft log: segmented records, group-commit fsync, torn-tail recovery."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
keel-raft = { workspace = true, features = ["serde"] }
crc32c = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rustix = { workspace = true }

[features]
# Disables durability rules so the simulator can demonstrate it catches the
# resulting violations (TR-8). Never enable outside negative-demo scripts.
negative-demos = []
# The shared Fs conformance suite, so the simulator's fault-injecting
# filesystem can be held to the same assertions as the real one.
conformance = []

[dev-dependencies]
# The integration tests link the library target, which is built without
# `cfg(test)` — so `conformance` has to be switched on the way any other
# consumer would switch it on, or `tests/fs_conformance.rs` does not compile
# under a plain `cargo test`.
keel-log = { path = ".", features = ["conformance"] }
tempfile = { workspace = true }

[lints]
workspace = true
