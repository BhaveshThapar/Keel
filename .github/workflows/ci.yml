name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features, because feature-gated code is exactly the code nobody
      # compiles by accident. This caught a module in the vendored engine that
      # had not compiled in four commits, because every check on both sides ran
      # with default features.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # And the default-feature build, which is what a consumer gets and what
      # the isolation gates are about: keel-net without `tcp` links no socket,
      # keel-sm without `lsm` links no storage engine.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The negative demonstrations must still demonstrate
        run: cargo test -p keel-raft --features negative-demos
      # keel-sim forwards the feature to keel-raft. Nothing else compiles that
      # forward, so without this a break in it would surface only inside the
      # negative-demo script, as a confusing failure a long way from its cause.
      - name: The simulator's feature forward must still compile
        run: cargo check -p keel-sim --features negative-demos --all-targets

  # A row in CORRECTNESS.md naming a test that no longer exists reads as
  # enforcement and enforces nothing, which is worse than a row that was never
  # written. Same for an ADR citation, a bug number, or a committed result whose
  # provenance says it came from a commit this branch does not contain.
  docs:
    name: the documents still name real things
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # check-artifacts.sh asks whether each artifact's commit is an ancestor
        # of HEAD, which a shallow clone cannot answer.
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The checkers are themselves shell, and so is every script that records
      # an artifact. An unquoted expansion in one of those is how a check comes
      # to pass by examining nothing.
      - name: the scripts lint
        run: shellcheck -x scripts/*.sh scripts/lib/*.sh scripts/negative-demos/*.sh
      - run: scripts/check-docs.sh
      - run: scripts/check-artifacts.sh

  determinism:
    name: the core replays identically
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run the determinism suite twice and require identical output. A
      # nondeterminism leak — an ambient clock, a hash-map iteration order —
      # turns into a red build the day it is introduced, rather than being
      # noticed months later when a simulator seed stops reproducing.
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run1.txt
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run2.txt
      - run: diff run1.txt run2.txt
      # The disk is inside the world's fingerprint now, so this is the gate that
      # would catch a nondeterministic tear. It can only do that if it is pointed
      # at a profile that tears.
      - name: the simulated disk replays identically
        run: |
          cargo run --release -p keel-sim -- determinism \
            --from 0 --count 40 --steps 30000 --nodes 3 --profile disk-hunt

  simulator:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes, shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Cluster size is not a detail. Commit needs the k-th highest match index
      # where k is the quorum size, so at five nodes two followers must sit on an
      # earlier term's entry at once and at three nodes only one must. KEEL-4:
      # a five-node cluster reached the Figure 8 window zero times, which made a
      # correct build and a deliberately broken one indistinguishable. Sweeping
      # only one size is how that bug survived.
      matrix:
        shard: [0, 1]
        nodes: [3, 5]
        profile: [default, chaos, fig8-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 600 seeds, not 250, and the difference is a measurement rather than a
      # feeling. results/simulator/disk-throughput.txt times the slowest cell of
      # this matrix at 600,150 steps/s on an M2 Pro. Divided by 6 for a runner
      # nobody has measured yet, that is 100,025 steps/s; five minutes of it is
      # 30,007,500 steps; at 50k steps a seed-run, 600 seeds. Five of the job's
      # 25 available sweep-minutes, so the runner factor can be wrong by five
      # times before this goes red.
      #
      # The shards are disjoint ranges, so the two of them cover seeds 0..1199
      # and no seed is swept twice.
      - name: 600 seeds x 50k steps
        run: |
          cargo run --release -p keel-sim -- run \
            --from $(( ${{ matrix.shard }} * 600 )) --count 600 \
            --steps 50000 --nodes ${{ matrix.nodes }} \
            --profile ${{ matrix.profile }}

  # The disk profiles run the real log over a disk that tears, so every record is
  # really encoded, checksummed, written and parsed and every restart re-scans
  # every segment. That costs enough per event to need its own job at its own
  # seed count rather than more cells on the matrix above — cutting the sweep
  # there to pay for it would trade breadth for depth in the wrong direction.
  #
  # Both sector sizes run. 4096 is what modern hardware is; 512 is where a
  # record of a few hundred bytes straddles a boundary often enough to tear.
  # A write only tears when it straddles one, so this axis is not a detail.
  disk-simulator:
    name: ${{ matrix.profile }}, ${{ matrix.nodes }} nodes
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        nodes: [3, 5]
        profile: [disk-chaos, disk-hunt]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # 200 seeds, derived the same way as the job above and from the same file.
      # disk-chaos at 3 nodes is the slowest cell in the workspace at 186,887
      # steps/s; 186,887 / 6 x 300 / 40,000 = 233, floored to 200.
      #
      # That it is only 200 against the other job's 600 is the finding, not a
      # concession: a seed-run here costs roughly three times as much, because
      # every record is really encoded, checksummed, written and parsed and every
      # restart re-scans every segment.
      - name: 200 seeds x 40k steps over the real log
        run: |
          cargo run --release -p keel-sim -- run \
            --from 0 --count 200 --steps 40000 \
            --nodes ${{ matrix.nodes }} \
            --profile ${{ matrix.profile }}

  negative-demo:
    name: ${{ matrix.demo }} must have teeth
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A matrix, so a failure names which demonstration stopped demonstrating
      # rather than just that one of them did.
      fail-fast: false
      matrix:
        demo: [figure-8, torn-record, tearing-is-load-bearing]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Removing a safety rule must make the simulator fail. A clean run is only
      # evidence if a broken build would have produced a dirty one. And
      # tearing-is-load-bearing holds the bug fixed and varies the fault model
      # instead, because three of the seven bugs so far were in the harness.
      - name: the rule removed must produce a violation
        run: scripts/negative-demos/${{ matrix.demo }}.sh
