name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: The negative demonstrations must still demonstrate
        run: cargo test -p keel-raft --features negative-demos

  determinism:
    name: the core replays identically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Run the determinism suite twice and require identical output. A
      # nondeterminism leak — an ambient clock, a hash-map iteration order —
      # turns into a red build the day it is introduced, rather than being
      # noticed months later when a simulator seed stops reproducing.
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run1.txt
      - run: cargo test -p keel-raft --test determinism -- --test-threads=1 > run2.txt
      - run: diff run1.txt run2.txt

  simulator:
    name: seeded fault injection
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        profile: [default, chaos]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 250 seeds x 50k steps
        run: |
          cargo run --release -p keel-sim -- run \
            --from $(( ${{ matrix.shard }} * 250 )) --count 250 \
            --steps 50000 --profile ${{ matrix.profile }}

  negative-demo:
    name: the checker must have teeth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Removing a safety rule must make the simulator fail. A clean run is only
      # evidence if a broken build would have produced a dirty one.
      - run: scripts/negative-demos/figure-8.sh 40 80000
