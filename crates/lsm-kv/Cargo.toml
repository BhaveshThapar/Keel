# Vendored from BhaveshThapar/LSM-Tree-Key-Value-Storage-Engine. See VENDORED.md
# for the upstream commit and what was changed.
[package]
name = "lsm_kv"
description = "A log-structured merge-tree key/value storage engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "lsm"
path = "src/bin/lsm.rs"

[dependencies]
thiserror = { workspace = true }
crc32fast = "1"
# CRC32C for the log frames, at the same version the workspace pins for
# keel-log. The two stacks checksum with the same polynomial now.
crc32c = { workspace = true }
lz4_flex = "0.11"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
parking_lot = "0.12"

# flock, for the database directory lock. Unix-only, as the engine's directory
# fsync already is.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
# tests/format_versions.rs rewrites frames the way a build from before the
# checksum change would have.
crc32fast = "1"

[features]
# Re-exports internal decoders for fuzz targets.
fuzzing = []
